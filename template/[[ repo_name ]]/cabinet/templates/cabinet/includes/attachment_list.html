{% comment %}The files of an attachment block, inside its accordion or not.{% endcomment %}
<div class="flex flex-col gap-2">
    {% for attachment in obj.listed_files %}
        <div class="mt-1 flex gap-2 odd:bg-white even:bg-gray-100">
            <div>
                <a href="{{ attachment.file.file.url }}" class="text-primary" tabindex="-1" aria-hidden="true">
                    <span class="material-symbols-outlined text-3xl!">download</span>
                </a>
            </div>
            <div>
                <div class="mt-2 font-bold"><a href="{{ attachment.file.file.url }}" class="text-primary no-underline hover:underline">{{ attachment.name }}</a> ({{ attachment.file.file.size|filesizeformat }})</div>
                {% if attachment.description %}<div class="my-2">{{ attachment.description }}</div>{% endif %}
            </div>
        </div>
    {% endfor %}
</div>
