{% load pages_tags editor_js_filters %}
<style>
    .video-iframe {
        aspect-ratio: 16 / 9;
    }
</style>
<div style="background-color: {{ object.background_color }}">
    {% if object.show_name %}<h3 class="font-medium">{{ object.name }}</h3>{% endif %}
    {{ object.description|render_editor_js }}
    <div class="d-flex justify-content-center">
        {% with embed=object.embed %}
            <iframe class="video-iframe" style="width: {{ object.width_percent }}%" src="{{ embed.url }}{% if object.platform == 3 %}&parent={{ request.get_host|replace:":8000|" }}{% endif %}" title="{{ embed.name }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        {% endwith %}
  </div>
</div>
